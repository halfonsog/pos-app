<div class="view-container">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <button class="btn btn-outline-secondary" id="btnVolver">
      <i class="fas fa-arrow-left me-1"></i>Volver
    </button>
    <h2 id="formTitle">Nuevo Producto</h2>
    <div></div> <!-- Espaciador -->
  </div>

  <form id="productoForm">
    <input type="hidden" id="productoId">

    <!-- Tabs de Bootstrap -->
    <ul class="nav nav-tabs mb-4" id="productoTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="generales-tab" data-bs-toggle="tab"
          data-bs-target="#generales" type="button" role="tab">
          <i class="fas fa-info-circle me-1"></i>Datos Generales
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="receta-tab" data-bs-toggle="tab"
          data-bs-target="#receta" type="button" role="tab">
          <i class="fas fa-list-ul me-1"></i>Receta
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="costo-tab" data-bs-toggle="tab"
          data-bs-target="#costo" type="button" role="tab">
          <i class="fas fa-calculator me-1"></i>Ficha de Costo
        </button>
      </li>
    </ul>

    <!-- Contenido de Tabs -->
    <div class="tab-content">
      <!-- Tab: Datos Generales -->
      <div class="tab-pane fade show active" id="generales" role="tabpanel">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Código <span
                class="text-danger">*</span></label>
            <input type="text" class="form-control" id="codigo" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Nombre <span
                class="text-danger">*</span></label>
            <input type="text" class="form-control" id="nombre" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Tipo</label>
            <select class="form-select" id="tipo">
              <option value="simple">Simple</option>
              <option value="compuesto">Compuesto</option>
            </select>
          </div>
          <div class="col-md-6" id="rowSubTipo">
            <label class="form-label">Sub-tipo</label>
            <select class="form-select" id="subTipo">
              <option value="reventa">Reventa</option>
              <option value="granel">A Granel</option>
            </select>
          </div>
          <div class="col-md-8">
            <label class="form-label">Categoría</label>
            <div class="input-group">
              <select class="form-select" id="categoriaId">
                <option value="">Seleccione...</option>
              </select>
              <button class="btn btn-outline-secondary" type="button"
                id="btnNuevaCategoria">
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Unidad de Venta</label>
            <select class="form-select" id="unidadVentaId" required></select>
          </div>
          <div class="col-md-4" id="rowUnidadCompra">
            <label class="form-label">Unidad de Compra</label>
            <select class="form-select" id="unidadCompraId"></select>
          </div>
          <div class="col-md-4" id="rowFactorConversion">
            <label class="form-label">Factor Conversión</label>
            <input type="number" class="form-control" id="factorConversion"
              value="1" step="0.01" min="0.01">
          </div>
          <div class="col-md-4">
            <label class="form-label">Precio de Venta</label>
            <input type="number" class="form-control" id="precioVenta" readonly
              disabled>
            <small class="text-muted">Calculado en Ficha de Costo</small>
          </div>
          <div class="col-md-6">
            <label class="form-label">Stock Mínimo</label>
            <input type="number" class="form-control" id="stockMinimo" value="0"
              step="0.01" min="0">
          </div>
          <div class="col-md-6">
            <label class="form-label">Stock Actual</label>
            <input type="number" class="form-control" id="stockActual" value="0"
              readonly disabled>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox"
                id="productoActivo">
              <label class="form-check-label">Producto Activo</label>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab: Receta -->
      <div class="tab-pane fade" id="receta" role="tabpanel">
        <div class="mb-3">
          <label class="form-label">Descripción de Preparación</label>
          <textarea class="form-control" id="descripcionPreparacion"
            rows="3"></textarea>
        </div>
        <div class="mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox"
              id="requierePreparacion">
            <label class="form-check-label">
              Requiere elaboración previa (Preparación en Inventario)
            </label>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0">Componentes</h6>
          <button type="button" class="btn btn-sm btn-primary"
            id="btnAgregarComponente">
            <i class="fas fa-plus me-1"></i>Añadir Componente
          </button>
        </div>

        <div id="recetaItems">
          <!-- Lista de componentes -->
        </div>
      </div>

      <!-- Tab: Ficha de Costo -->
      <div class="tab-pane fade" id="costo" role="tabpanel">
        <div id="fichaCostoContent">
          <!-- Contenido dinámico -->
        </div>
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="mt-4 d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-secondary" id="btnCancelar">
        <i class="fas fa-times me-1"></i>Cancelar
      </button>
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save me-1"></i>Guardar Producto
      </button>
    </div>
  </form>
</div>
