<div class="view-container">
  <!-- Header con título y acciones -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">
      <i class="fas fa-truck me-2"></i>Proveedores
    </h2>
    <button class="btn btn-primary" id="btnNuevoProveedor">
      <i class="fas fa-plus me-1"></i>Nuevo Proveedor
    </button>
  </div>

  <!-- Filtros rápidos (Pills de Bootstrap) -->
  <div class="mb-3">
    <div class="btn-group" role="group">
      <button type="button" class="btn btn-outline-primary active"
        id="filtroTodos">
        <i class="fas fa-list me-1"></i>Todos
      </button>
      <button type="button" class="btn btn-outline-warning" id="filtroConDeuda">
        <i class="fas fa-exclamation-circle me-1"></i>Con Deuda
      </button>
      <button type="button" class="btn btn-outline-secondary"
        id="filtroInactivos">
        <i class="fas fa-ban me-1"></i>Inactivos
      </button>
    </div>
  </div>

  <!-- Barra de búsqueda (Input Group de Bootstrap) -->
  <div class="row mb-3">
    <div class="col-md-6 col-lg-4">
      <div class="input-group">
        <span class="input-group-text">
          <i class="fas fa-search"></i>
        </span>
        <input type="text" class="form-control" id="buscarProveedor"
          placeholder="Buscar por nombre, ID fiscal...">
      </div>
    </div>
  </div>

  <!-- Tabla (DataTable) -->
  <div class="table-responsive">
    <table class="table table-hover" id="proveedoresTable" style="width:100%">
      <thead class="table-light">
        <tr>
          <th>Nombre</th>
          <th>ID Fiscal</th>
          <th>Teléfono</th>
          <th class="text-end">Saldo Pendiente</th>
          <th class="text-center">Estado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- DataTable llenará esto -->
      </tbody>
    </table>
  </div>
</div>
