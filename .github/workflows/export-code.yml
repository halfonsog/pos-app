name: Export Code as Artifact

on:
  workflow_dispatch:  # Esto permite ejecutarlo manualmente

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Compress source code
        run: |
          # Excluye node_modules, .git, y archivos innecesarios
          zip -r pos-app-code.zip . -x "*.git*" "node_modules/*" ".env" "*.log"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-app-source
          path: pos-app-code.zip
          retention-days: 3  # Se borrará automáticamente en 3 días
